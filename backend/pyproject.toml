[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense"
version = "1.0.0"
description = "Simulated retail inventory intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "pandas>=2,<3", "numpy>=2,<3", "scipy>=1.13,<2", "typer>=0.12,<1", "uvicorn>=0.30,<1",
]

[project.scripts]
stocksense = "stocksense.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.9", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["unit: no database required", "db: real PostgreSQL required", "api: API against real PostgreSQL", "slow: standard dataset", "requires_run: analytics run required in Phase 3"]

[tool.uv]
constraint-dependencies = ["starlette<1", "anyio<4.12"]
